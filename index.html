<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#065f46" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SplitNest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>SplitNest - Expense Tracker</title>

    <!-- Instant Light-Mode Boot Shell (Eliminates 2-3s cold-start black screen) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #f8fafc;
        color: #111c2d;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes sn-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.52; }
      }
      .sn-shimmer {
        background-color: #e2e8f0;
        animation: sn-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .sn-shimmer-soft {
        background-color: #f1f5f9;
        animation: sn-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .sn-shimmer-brand {
        background-color: rgba(6, 95, 70, 0.14);
        animation: sn-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #sn-boot-shell .sn-boot-desktop {
        display: none;
      }
      #sn-boot-shell .sn-boot-mobile {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
        background-color: #f8fafc;
      }
      @media (min-width: 768px) {
        #sn-boot-shell .sn-boot-mobile {
          display: none;
        }
        #sn-boot-shell .sn-boot-desktop {
          display: flex;
          min-height: 100vh;
          width: 100%;
          align-items: center;
          justify-content: center;
          padding: 24px;
          box-sizing: border-box;
          background-color: #f8fafc;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Space+Grotesk:wght@400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Space+Grotesk:wght@400..700&display=swap"
      />
    </noscript>
  </head>

  <body
    class="bg-surface-canvas text-neutral-900 font-sans antialiased selection:bg-primary selection:text-white"
  >
    <div id="root">
      <div id="sn-boot-shell" aria-busy="true" aria-label="Loading SplitNest">
        <!-- Desktop >= 768px Boot Skeleton -->
        <div class="sn-boot-desktop">
          <div style="width:100%;max-width:512px;background:#ffffff;border:1px solid #e2e8f0;border-radius:24px;padding:32px;box-sizing:border-box;box-shadow:0 12px 32px rgba(15,23,42,0.06);">
            <div class="sn-shimmer-brand" style="width:160px;height:28px;border-radius:9999px;margin:0 auto 24px;"></div>
            <div class="sn-shimmer-soft" style="width:96px;height:152px;border:4px solid #e2e8f0;border-radius:16px;margin:0 auto 24px;"></div>
            <div class="sn-shimmer" style="height:26px;width:65%;border-radius:10px;margin:0 auto 10px;"></div>
            <div class="sn-shimmer-soft" style="height:14px;width:82%;border-radius:8px;margin:0 auto 24px;"></div>
            <div class="sn-shimmer-soft" style="height:76px;border-radius:16px;margin-bottom:16px;"></div>
            <div class="sn-shimmer-brand" style="height:42px;border-radius:12px;"></div>
          </div>
        </div>

        <!-- Mobile < 768px Boot Skeleton -->
        <div class="sn-boot-mobile">
          <header style="position:fixed;top:0;left:0;right:0;height:64px;background:rgba(248,250,252,0.96);border-bottom:1px solid #e2e8f0;padding:0 16px;display:flex;align-items:center;justify-content:space-between;max-width:448px;margin:0 auto;box-sizing:border-box;z-index:40;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="sn-shimmer-brand" style="width:36px;height:36px;border-radius:12px;"></div>
              <div>
                <div class="sn-shimmer" style="width:96px;height:14px;border-radius:6px;margin-bottom:6px;"></div>
                <div class="sn-shimmer-soft" style="width:128px;height:10px;border-radius:4px;"></div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div class="sn-shimmer-soft" style="width:64px;height:30px;border-radius:9999px;"></div>
              <div class="sn-shimmer-brand" style="width:36px;height:36px;border-radius:9999px;"></div>
            </div>
          </header>

          <main style="flex:1;width:100%;max-width:448px;margin:0 auto;padding:80px 16px 96px;box-sizing:border-box;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
              <div>
                <div class="sn-shimmer" style="width:112px;height:26px;border-radius:8px;margin-bottom:6px;"></div>
                <div class="sn-shimmer-soft" style="width:144px;height:12px;border-radius:6px;"></div>
              </div>
              <div class="sn-shimmer" style="width:110px;height:32px;border-radius:9999px;"></div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
              <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;">
                <div class="sn-shimmer-soft" style="width:90px;height:10px;border-radius:4px;margin-bottom:12px;"></div>
                <div class="sn-shimmer" style="width:80px;height:22px;border-radius:6px;margin-bottom:8px;"></div>
                <div class="sn-shimmer-soft" style="width:72px;height:10px;border-radius:4px;"></div>
              </div>
              <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;">
                <div class="sn-shimmer-soft" style="width:64px;height:10px;border-radius:4px;margin-bottom:12px;"></div>
                <div class="sn-shimmer" style="width:80px;height:22px;border-radius:6px;margin-bottom:8px;"></div>
                <div class="sn-shimmer-soft" style="width:60px;height:10px;border-radius:4px;"></div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
              <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;">
                <div class="sn-shimmer-soft" style="width:76px;height:11px;border-radius:4px;margin-bottom:14px;"></div>
                <div class="sn-shimmer" style="width:92px;height:26px;border-radius:6px;margin-bottom:8px;"></div>
                <div class="sn-shimmer-soft" style="width:104px;height:10px;border-radius:4px;"></div>
              </div>
              <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;">
                <div class="sn-shimmer-soft" style="width:72px;height:11px;border-radius:4px;margin-bottom:14px;"></div>
                <div class="sn-shimmer" style="width:84px;height:26px;border-radius:6px;margin-bottom:8px;"></div>
                <div class="sn-shimmer-soft" style="width:90px;height:10px;border-radius:4px;"></div>
              </div>
            </div>

            <div style="display:flex;gap:10px;margin-bottom:14px;">
              <div class="sn-shimmer-brand" style="flex:1;height:48px;border-radius:12px;"></div>
              <div class="sn-shimmer" style="flex:1;height:48px;border-radius:12px;"></div>
            </div>

            <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;height:54px;margin-bottom:12px;"></div>
            <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:10px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <div class="sn-shimmer" style="width:40px;height:40px;border-radius:12px;"></div>
                <div style="flex:1;">
                  <div class="sn-shimmer" style="width:65%;height:14px;border-radius:6px;margin-bottom:8px;"></div>
                  <div class="sn-shimmer-soft" style="width:45%;height:10px;border-radius:4px;"></div>
                </div>
                <div class="sn-shimmer" style="width:52px;height:18px;border-radius:6px;"></div>
              </div>
            </div>
            <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <div class="sn-shimmer" style="width:40px;height:40px;border-radius:12px;"></div>
                <div style="flex:1;">
                  <div class="sn-shimmer" style="width:58%;height:14px;border-radius:6px;margin-bottom:8px;"></div>
                  <div class="sn-shimmer-soft" style="width:40%;height:10px;border-radius:4px;"></div>
                </div>
                <div class="sn-shimmer" style="width:52px;height:18px;border-radius:6px;"></div>
              </div>
            </div>
          </main>

          <nav style="position:fixed;bottom:0;left:0;right:0;height:64px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-around;max-width:448px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);">
            <div class="sn-shimmer" style="width:24px;height:24px;border-radius:8px;"></div>
            <div class="sn-shimmer" style="width:24px;height:24px;border-radius:8px;"></div>
            <div class="sn-shimmer-brand" style="width:44px;height:32px;border-radius:12px;"></div>
            <div class="sn-shimmer" style="width:24px;height:24px;border-radius:8px;"></div>
            <div class="sn-shimmer" style="width:24px;height:24px;border-radius:8px;"></div>
          </nav>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
